<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoSystem Connect</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section id="loginPage" class="screen active" aria-label="Inicio de sesion">
      <div class="login-panel">
        <p class="eyebrow">EcoSystem Connect</p>
        <h1>Iniciar sesion</h1>
        <label>Usuario
          <input id="username" autocomplete="username" placeholder="admin o user">
        </label>
        <label>Contrasena
          <input id="password" type="password" autocomplete="current-password" placeholder="Contrasena configurada">
        </label>
        <button id="loginButton" type="button">Iniciar sesion</button>
        <p id="loginMessage" class="message" role="status"></p>
      </div>
    </section>

    <section id="productosPage" class="screen" aria-label="Productos">
      <header class="toolbar">
        <div>
          <p class="eyebrow">Productos</p>
          <h1>Inventario EcoSystem</h1>
          <p id="sessionInfo" class="muted"></p>
        </div>
        <div class="actions">
          <button id="reloadButton" type="button">Recargar</button>
          <button id="logoutButton" type="button" class="secondary">Cerrar sesion</button>
        </div>
      </header>

      <section class="form-panel" aria-label="Formulario de producto">
        <h2 id="formTitle">Nuevo producto</h2>
        <input id="productId" type="hidden">
        <div class="form-grid">
          <label>Nombre
            <input id="nombre" placeholder="Nombre del producto">
          </label>
          <label>Precio
            <input id="precio" type="number" min="0" step="0.01" placeholder="0.00">
          </label>
          <label>Existencias
            <input id="stock" type="number" min="0" step="1" placeholder="0">
          </label>
        </div>
        <div class="actions left">
          <button id="saveButton" type="button">Guardar</button>
          <button id="cancelEditButton" type="button" class="secondary">Cancelar</button>
        </div>
        <p id="formMessage" class="message" role="status"></p>
      </section>

      <section class="list-panel" aria-label="Lista de productos">
        <div class="list-header">
          <h2>Lista de productos</h2>
          <span id="loadingLabel" class="muted"></span>
        </div>
        <div id="productosList" class="product-list"></div>
      </section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
